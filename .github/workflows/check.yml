name: checks
on: [push, pull_request]
jobs:
  mvp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: bash scripts/setup.sh
      - run: bash scripts/check.sh
      - run: bash scripts/build-demo.sh
      - run: cd frontend && npx playwright install --with-deps chromium && npm run test:e2e
      - run: cd frontend && STOCKPILOT_OFFLINE_TEST=1 npm run test:e2e
      - run: npm --prefix frontend run build:vercel
      - run: cd frontend && STOCKPILOT_HOSTED_DEMO_TEST=1 npm run test:e2e
